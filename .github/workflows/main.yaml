project: Kanban Pro
name: CI/CD
on:
  pull_request:
    branches: [main, dev]
jobs:
  code-validation:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js Env
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install packages
        run: npm ci

      - name: Check code formatting and errors (Lint)
        run: npm run lint
